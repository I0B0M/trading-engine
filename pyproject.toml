[project]
name = "trading-engine"
version = "0.1.0"
description = "Event-driven backtesting engine for stock trading strategies, with paper-trading and AI layers to follow."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "pyarrow>=16.0",
    "matplotlib>=3.9",
]

[project.scripts]
trade = "trading_engine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
